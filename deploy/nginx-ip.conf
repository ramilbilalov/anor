# Nginx reverse proxy for IP-only deployment (no domain yet).
# Lets you open http://<IP>/ instead of http://<IP>:3000
#
# Install on the server:
#   sudo cp deploy/nginx-ip.conf /etc/nginx/sites-available/anor
#   sudo ln -s /etc/nginx/sites-available/anor /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# NOTE: this is plain HTTP. Add a domain + HTTPS (see DEPLOY.md) before using
# the admin panel for real — otherwise the password travels unencrypted.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 16M;  # allow product photo uploads

    # Serve user-uploaded product photos directly from disk.
    # Next.js does not serve files added to public/ after the build, so Nginx
    # handles /uploads/ itself (also faster and cacheable).
    location /uploads/ {
        alias /var/www/anor/public/uploads/;
        access_log off;
        expires 30d;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
